<script>
(function () {
  const b = document.querySelector('.burger'), m = document.getElementById('menu');
  const set = open => { b.setAttribute('aria-expanded', open); m.classList.toggle('open', open); };
  b.addEventListener('click', () => set(b.getAttribute('aria-expanded') !== 'true'));
  m.addEventListener('click', e => { if (e.target.closest('a')) set(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
  // close on tap outside the menu, and on scroll
  document.addEventListener('click', e => { if (b.getAttribute('aria-expanded') === 'true' && !m.contains(e.target) && !b.contains(e.target)) set(false); });
  addEventListener('scroll', () => { if (b.getAttribute('aria-expanded') === 'true') set(false); }, { passive: true });
})();
</script>
