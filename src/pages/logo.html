<!--
title: Logo and brand assets — Freedom Browser
ogTitle: Freedom logo and brand assets
description: Download the Freedom Browser wordmark and app icon as SVG and PNG, in light and dark versions.
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
{{> head}}  <link rel="stylesheet" href="{{root}}assets/content.css">
</head>
<body>

{{> nav}}

<div class="top page-top">
<header class="hero-in">
  
  <h1>Logo</h1>
  
</header>
</div>

<main class="prose-wrap cd">
<article class="prose logo-page">
<p>The Freedom wordmark and app icon, as SVG and PNG.</p>

<h2>Wordmark</h2>
<div class="logo-grid">
<figure class="logo-tile on-dark word">
  <div class="logo-art"><img src="images/logo/freedom-logo-white.svg" alt="Freedom wordmark, white"></div>
  <figcaption><b>Wordmark, white</b><span><a href="images/logo/freedom-logo-white.svg" download>SVG</a> <i>·</i> <a href="images/logo/freedom-logo-white.png" download>PNG</a></span></figcaption>
</figure>
<figure class="logo-tile on-light word">
  <div class="logo-art"><img src="images/logo/freedom-logo-black.svg" alt="Freedom wordmark, black"></div>
  <figcaption><b>Wordmark, black</b><span><a href="images/logo/freedom-logo-black.svg" download>SVG</a> <i>·</i> <a href="images/logo/freedom-logo-black.png" download>PNG</a></span></figcaption>
</figure>
</div>

<h2>App icon</h2>
<div class="logo-grid">
<figure class="logo-tile on-light icon">
  <div class="logo-art"><img src="images/logo/freedom-icon-dark.svg" alt="Freedom app icon, square, dark"></div>
  <figcaption><b>Square, dark</b><span><a href="images/logo/freedom-icon-dark.svg" download>SVG</a> <i>·</i> <a href="images/logo/freedom-icon-dark.png" download>PNG</a></span></figcaption>
</figure>
<figure class="logo-tile on-dark icon">
  <div class="logo-art"><img src="images/logo/freedom-icon-light.svg" alt="Freedom app icon, square, light"></div>
  <figcaption><b>Square, light</b><span><a href="images/logo/freedom-icon-light.svg" download>SVG</a> <i>·</i> <a href="images/logo/freedom-icon-light.png" download>PNG</a></span></figcaption>
</figure>
<figure class="logo-tile on-light icon">
  <div class="logo-art"><img src="images/logo/freedom-icon-rounded-dark.svg" alt="Freedom app icon, rounded, dark"></div>
  <figcaption><b>Rounded, dark</b><span><a href="images/logo/freedom-icon-rounded-dark.svg" download>SVG</a> <i>·</i> <a href="images/logo/freedom-icon-rounded-dark.png" download>PNG</a></span></figcaption>
</figure>
<figure class="logo-tile on-dark icon">
  <div class="logo-art"><img src="images/logo/freedom-icon-rounded-light.svg" alt="Freedom app icon, rounded, light"></div>
  <figcaption><b>Rounded, light</b><span><a href="images/logo/freedom-icon-rounded-light.svg" download>SVG</a> <i>·</i> <a href="images/logo/freedom-icon-rounded-light.png" download>PNG</a></span></figcaption>
</figure>
</div>

<h2>Colours</h2>
<ul class="swatches">
  <li><i style="background:#FFB111"></i><b>Orange</b><code>#FFB111</code></li>
  <li><i style="background:#00E9C4"></i><b>Teal</b><code>#00E9C4</code></li>
  <li><i style="background:#1C1E26"></i><b>Icon dark</b><code>#1C1E26</code></li>
</ul>
</article>
</main>

{{> footer}}

{{> scripts}}</body>
</html>
