# SEO and caching settings for freedom.baby: a reference snippet, NOT applied.
#
# Nothing in this repo installs or reloads this file. Merge it by hand into
# the server's existing nginx site config, then check and reload:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust root, certificate paths and the download locations to what the live
# config already uses; keep its existing locations for the installers
# (/download/...) and for freedom.baby/stats. Each block says what it fixes.

# 1. One host. www.freedom.baby (and plain http) redirect permanently to
#    https://freedom.baby, so search engines see a single canonical origin.
server {
    listen 80;
    listen [::]:80;
    server_name freedom.baby www.freedom.baby;
    return 301 https://freedom.baby$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx >= 1.25.1; older: "listen 443 ssl http2;"
    server_name www.freedom.baby;
    # ssl_certificate     /etc/letsencrypt/live/freedom.baby/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/freedom.baby/privkey.pem;
    return 301 https://freedom.baby$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # 2. HTTP/2: parallel requests over one connection
    server_name freedom.baby;
    # ssl_certificate     /etc/letsencrypt/live/freedom.baby/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/freedom.baby/privkey.pem;

    root /var/www/freedom.baby;    # wherever dist/ is deployed
    index index.html;
    charset utf-8;

    # 3. HSTS: browsers go straight to https. Start with a short max-age if
    #    unsure; add "; preload" only once every subdomain is https-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 4. /index.html duplicates /. Redirect it so only the canonical URL is
    #    indexed. ("= " matches only the exact request, so the index
    #    directive's internal lookup for / is not affected.)
    location = /index.html {
        return 301 /;
    }

    # 5. Cache-Control. HTML, the feed and the sitemap revalidate on every
    #    visit so a deploy shows up at once; fonts, images and the other
    #    assets are cached for a week. The asset names are not fingerprinted,
    #    so do not mark them immutable.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ~* \.(?:css|js|woff2|png|jpg|jpeg|webp|svg|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    location = /feed.xml {
        default_type application/rss+xml;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /releases.xml {
        default_type application/rss+xml;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    # (add_header in a location replaces, not extends, the server-level
    # headers, which is why HSTS is repeated in each location above.)

    # 6. The branded 404 page from dist/404.html, with a real 404 status.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # 7. Compression for the text types (gzip is in core nginx; brotli needs
    #    an extra module, skip it unless already installed).
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/rss+xml application/xml image/svg+xml application/manifest+json;
}

# The manifest type, if the server's mime.types lacks it (inside http {}):
#   types { application/manifest+json webmanifest; }
