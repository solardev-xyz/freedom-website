# freedom.baby: serve the agent-readable Markdown twins (developer/*.html.md)
# as text/markdown. Stock nginx mime.types has no `md` entry, so without this
# they go out as application/octet-stream. The scoped `types { }` leaves every
# other extension on the server's normal mapping.
#
# Include inside the freedom.baby server block:
#   include /path/to/freedom-website/deploy/nginx-markdown.conf;
# then: nginx -t && systemctl reload nginx
#       curl -sI https://freedom.baby/developer/index.html.md | grep -i content-type
location ~ \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
}
