# freedom.baby: serve the agent-readable Markdown twins (developer/*.html.md)
# as text/markdown. Stock nginx mime.types has no `md` entry, so without this
# they go out as application/octet-stream. The scoped `types { }` leaves every
# other extension on the server's normal mapping.
#
# Include INSIDE the existing `location / { ... }` block of the freedom.baby
# server, not at server level:
#   location / {
#       ...
#       include /path/to/freedom-website/deploy/nginx-markdown.conf;
#   }
# A regex location at server level wins over the `/` prefix location, so the
# root, try_files and add_header set there would not apply to .md requests.
# Nested, it inherits root and add_header (it sets no add_header of its own)
# and we repeat the plain static try_files. If the server has no
# `location /` (root/headers at server level), server level is fine too.
# Then: nginx -t && systemctl reload nginx
#       curl -sI https://freedom.baby/developer/index.html.md | grep -i content-type
location ~ \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
}
